[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "3d-template-project"
version = "0.1.0"
description = "基于 NumPy, Trimesh 和 Open3D 的 3D 模板开发项目"
readme = "README.md"
requires-python = ">=3.8, <3.11"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
    "numpy == 1.23.5",
    "trimesh == 3.23.5",
    "open3d == 0.17.0",
    "usd-core>=26.3",
]

[tool.setuptools]
# 删掉具体的 packages = [...]，改用自动发现
package-dir = {"" = "."}

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt"]
